<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f7" />
    <script>
      // Paints the saved (or system) theme before the first frame so there is no flash. Keep the key in
      // sync with THEME_KEY in src/lib/theme.ts.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('cifras.theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0a0b0d' : '#f4f5f7');
      })();
    </script>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <style>
      html,
      body {
        margin: 0;
        background: #f4f5f7;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #0a0b0d;
        color-scheme: dark;
      }
      .boot {
        margin: 0;
        padding: 2rem 1rem;
        color: #71717a;
        font:
          16px system-ui,
          sans-serif;
        text-align: center;
      }
    </style>
    <title>Cifras · Louvor</title>
  </head>
  <body>
    <div id="root">
      <p role="status" class="boot">Carregando…</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
