name: Deploy

on:
  push:
    branches: [main]
    # Push só de harness, docs ou testes não muda o que vai para produção.
    paths-ignore:
      - '.claude/**'
      - 'docs/**'
      - '*.md'
      - '.github/pull_request_template.md'
      - '.github/workflows/ci.yml'
      - 'e2e/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verificar configuração de produção
        id: config
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
        run: |
          total=0
          missing=""
          # VITE_FIREBASE_MESSAGING_SENDER_ID e VITE_FIREBASE_VAPID_KEY são opcionais de propósito (avisos push, #99): ficam fora desta lista.
          for name in FIREBASE_PROJECT_ID FIREBASE_SERVICE_ACCOUNT VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_APP_ID ADMIN_EMAILS; do
            total=$((total + 1))
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          missing_count=$(echo "$missing" | wc -w)
          if [ "$missing_count" -eq "$total" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy ignorado: produção ainda não configurada (docs/deploy.md)"
          elif [ "$missing_count" -gt 0 ]; then
            echo "::error::Configuração de produção incompleta; faltando:$missing (docs/deploy.md)"
            exit 1
          elif [ "$VITE_FIREBASE_PROJECT_ID" != "$FIREBASE_PROJECT_ID" ]; then
            echo "::error::VITE_FIREBASE_PROJECT_ID difere de FIREBASE_PROJECT_ID"
            exit 1
          elif [[ "$ADMIN_EMAILS" == *[$'\r\n"'\''#\=']* ]]; then
            echo "::error::ADMIN_EMAILS contém caractere inválido (quebra de linha, aspas, #, \ ou =); use apenas e-mails separados por vírgula"
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.config.outputs.configured == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        if: steps.config.outputs.configured == 'true'
        run: npm ci

      - name: Build
        if: steps.config.outputs.configured == 'true'
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
          VITE_USE_EMULATORS: 'false'
          VITE_APP_VERSION: ${{ github.sha }}
        run: npm run build

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        if: steps.config.outputs.configured == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Antes do deploy: se a instalação falhar, o deploy não acontece e a checagem não fica sem rodar.
      - name: Instalar Chromium da checagem
        if: steps.config.outputs.configured == 'true'
        run: npm exec -w @cifras/e2e -- playwright install --with-deps chromium

      - name: Deploy no Firebase
        if: steps.config.outputs.configured == 'true'
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
        run: |
          printf 'ADMIN_EMAILS=%s\n' "$ADMIN_EMAILS" > "apps/functions/.env.$FIREBASE_PROJECT_ID"
          npx firebase deploy --only hosting:louvor-hajaluz,hosting:cifras-louvor-5dd50,functions,firestore,storage --project "$FIREBASE_PROJECT_ID" --non-interactive --force

      - name: Checar o site publicado
        id: smoke
        if: steps.config.outputs.configured == 'true'
        env:
          SMOKE_URL: https://louvor-hajaluz.web.app
          EXPECTED_VERSION: ${{ github.sha }}
        run: npm run smoke -w @cifras/e2e

      # Volta automática: só quando a checagem do site novo falha num push para a main. Alvo: o último
      # commit que passou na checagem (último Deploy verde na main), não o commit anterior, que pode
      # ser o próprio release quebrado de uma volta anterior. Cada passo exige o anterior ok.
      - name: Escolher o commit da volta
        id: rb_target
        if: failure() && steps.smoke.outcome == 'failure' && github.event_name == 'push' && steps.config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FALLBACK_SHA: ${{ github.event.before }}
        run: |
          # Sem deploy verde, o jq imprime vazio (// empty); se o gh falhar, segue com o fallback.
          sha=$(gh run list --workflow deploy.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
          zeros=0000000000000000000000000000000000000000
          if [ -z "$sha" ] || [ "$sha" = "null" ] || [ "$sha" = "$zeros" ]; then
            sha="$FALLBACK_SHA"
          fi
          if [ -z "$sha" ] || [ "$sha" = "null" ] || [ "$sha" = "$zeros" ]; then
            sha=""
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Preparar a volta (checkout do commit da volta)
        id: rb_checkout
        if: failure() && steps.smoke.outcome == 'failure' && github.event_name == 'push' && steps.config.outputs.configured == 'true' && steps.rb_target.outcome == 'success' && steps.rb_target.outputs.sha != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.rb_target.outputs.sha }}
          path: rollback

      - name: Instalar dependências da volta
        id: rb_install
        if: failure() && steps.smoke.outcome == 'failure' && github.event_name == 'push' && steps.config.outputs.configured == 'true' && steps.rb_checkout.outcome == 'success'
        working-directory: rollback
        run: npm ci

      - name: Build da volta
        id: rb_build
        if: failure() && steps.smoke.outcome == 'failure' && github.event_name == 'push' && steps.config.outputs.configured == 'true' && steps.rb_install.outcome == 'success'
        working-directory: rollback
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
          VITE_USE_EMULATORS: 'false'
          VITE_APP_VERSION: ${{ steps.rb_target.outputs.sha }}
        run: npm run build

      - name: Deploy da volta
        id: rb_deploy
        if: failure() && steps.smoke.outcome == 'failure' && github.event_name == 'push' && steps.config.outputs.configured == 'true' && steps.rb_build.outcome == 'success'
        working-directory: rollback
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
        run: |
          printf 'ADMIN_EMAILS=%s\n' "$ADMIN_EMAILS" > "apps/functions/.env.$FIREBASE_PROJECT_ID"
          npx firebase deploy --only hosting:louvor-hajaluz,hosting:cifras-louvor-5dd50,functions,firestore,storage --project "$FIREBASE_PROJECT_ID" --non-interactive --force

      # Também roda no timeout do job (cancelled()): o GitHub cancela a execução e pula os passos comuns.
      - name: Abrir incidente
        if: (failure() || cancelled()) && steps.config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SMOKE: ${{ steps.smoke.outcome }}
          ROLLBACK_TARGET: ${{ steps.rb_target.outcome }}
          ROLLBACK_SHA: ${{ steps.rb_target.outputs.sha }}
          ROLLBACK_DEPLOY: ${{ steps.rb_deploy.outcome }}
        run: |
          body="Execução: $RUN_URL"
          if [ "$SMOKE" = "failure" ] && [ "$ROLLBACK_TARGET" = "skipped" ]; then
            body="$body

          A checagem falhou; sem volta automática (execução manual)."
          elif [ "$SMOKE" = "failure" ] && [ -z "$ROLLBACK_SHA" ]; then
            body="$body

          A checagem falhou; sem commit verde para voltar: produção precisa de intervenção manual."
          elif [ "$SMOKE" = "failure" ] && [ "$ROLLBACK_DEPLOY" = "success" ]; then
            body="$body

          Volta automática: produção voltou para o commit $ROLLBACK_SHA (último deploy que passou na checagem)."
          elif [ "$SMOKE" = "failure" ]; then
            body="$body

          A checagem falhou e a volta automática para $ROLLBACK_SHA também falhou: produção precisa de intervenção manual."
          else
            body="$body

          A falha foi antes da checagem do site publicado."
          fi
          gh label create incidente --color b60205 --description "Deploy ou checagem falhou em produção" --force || true
          gh issue create --label incidente --title "Incidente: deploy de $SHA falhou" --body "$body"
